name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login
        run: |
          docker login ${{ secrets.ACR_LOGIN_SERVER }} \
            -u ${{ secrets.ACR_USERNAME }} \
            -p ${{ secrets.ACR_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/csharp01:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push \
          ${{ secrets.ACR_LOGIN_SERVER }}/csharp01:${{ github.sha }}

      - name: Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: csharp01-api
          resourceGroup: rg-csharp01
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/csharp01:${{ github.sha }}